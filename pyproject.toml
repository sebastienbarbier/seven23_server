[project]
name = "seven23-server"
version = "1.5.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==4.2.7",
    "djangorestframework==3.14.0",
    "djangorestframework-bulk==0.2.1",
    "django-filter==21.1",
    "django-cors-headers==3.14.0",
    "django-allauth==0.54.0",
    "dj-rest-auth==3.0.0",
    "drf-yasg==1.21.5",
    "drf-writable-nested==0.7.0",
    "django-mptt==0.14.0",
    "django-colorfield==0.8.0",
    "django-sass-processor==1.2.2",
    "libsass==0.22.0",
    "django-storages==1.13.2",
    "django-reset-migrations==0.4.0",
    "boto3==1.26.114",
    "dj-database-url==1.3.0",
    "gunicorn==20.1.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.0",
    "sentry-sdk==1.19.1",
    "stripe==5.4.0",
    "whitenoise==6.4.0",
    "markdown2==2.4.8",
]

[dependency-groups]
dev = [
    "sphinx==5.3.0",
    "sphinx-rtd-theme==1.1.1",
    "sphinx-autobuild==2021.3.14",
    "myst-parser==1.0.0",
    "pylint==2.17.2",
    "pylint-django==2.5.3",
]

[tool.uv]
package = false
default-groups = ["dev"]
